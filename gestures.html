<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wave & touch links</title>
  <style>
    :root{color-scheme:light;font-family:Arial,sans-serif;color:#202124;background:#f4f6f9}
    *{box-sizing:border-box}body{margin:0;padding:36px 16px}main{max-width:470px;margin:auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 4px 20px #23334b0c}
    h1{font-size:26px;letter-spacing:-.6px;margin:0 0 8px;text-align:center}p{font-size:14px;line-height:1.55;color:#5f6368;margin:0 0 22px}.intro{text-align:center}
    button{width:100%;padding:13px 16px;border:0;border-radius:8px;font:600 15px Arial,sans-serif;cursor:pointer;background:#1a73e8;color:white}button:hover:not(:disabled){background:#1557b0}button:disabled{opacity:.45;cursor:not-allowed}
    #connectBtn.connected{background:#edf1f6;color:#344054}#connectBtn.connected:hover{background:#e1e7ef}
    #status{font-size:13px;font-weight:600;background:#f0f3f7;border-radius:8px;padding:11px 13px;margin:12px 0 0;line-height:1.5;overflow-wrap:anywhere}#status.error{color:#a93529;background:#fff1ef}
    .live{font-size:12px;text-align:center;color:#77808b;margin:8px 0 22px}hr{border:0;border-top:1px solid #e8ebef;margin:22px 0}
    label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}input{width:100%;padding:13px;border:1px solid #d8dce3;border-radius:8px;font:15px Arial,sans-serif;margin-bottom:20px;color:#202124;background:white}input:disabled{background:#f5f7fa;color:#647084}
    button:focus-visible,input:focus-visible{outline:3px solid #90bbf5;outline-offset:3px}.help{font-size:12px;line-height:1.55;margin:12px 0 0;text-align:center}.saved{font-size:11px;color:#89909a;text-align:center;margin-top:18px}
    @media(max-width:420px){body{padding:20px 12px}main{padding:24px 20px}}
  </style>
</head>
<body>
<main>
  <h1>Wave & touch links</h1>
  <p class="intro">Choose a link for each gesture.<br>Move your hand away to open it.</p>
  <button id="connectBtn">Connect Bluetooth</button>
  <div id="status" role="status" aria-live="polite">Disconnected</div>
  <div class="live">Sensor reading: <span id="reading">—</span></div>
  <hr>
  <label for="waveUrl">Wave / hover</label>
  <input id="waveUrl" type="text" placeholder="e.g. google.com" autocomplete="off" spellcheck="false" inputmode="url">
  <label for="touchUrl">Touch / hold</label>
  <input id="touchUrl" type="text" placeholder="e.g. youtube.com" autocomplete="off" spellcheck="false" inputmode="url">
  <button id="startBtn" disabled>Start gestures</button>
  <p class="help">Start opens one tab for your links. Keep this controller tab open. Leave a link blank to disable that gesture.</p>
  <div class="saved">Your links are saved in this browser.</div>
</main>
<script>
'use strict';
const SERVICE='0000ffe0-0000-1000-8000-00805f9b34fb';
const CHARACTERISTIC='0000ffe1-0000-1000-8000-00805f9b34fb';
// Absolute ADCTouch readings selected from the user's measurements.
const WAVE_MIN=448,WAVE_MAX=452,TOUCH_MIN=601,RELEASE_MAX=447;
const $=id=>document.getElementById(id);
let device=null,characteristic=null,connected=false,connecting=false;
let decoder=new TextDecoder(),buffer='',lastReadingAt=null,connectedAt=0;
let running=false,outputTab=null,links=null,detector=newDetector();

function newDetector(until=0){
  return {phase:'waiting',until,quietSince:null,quietCount:0,waveSince:null,waveCount:0,touchSince:null,touchCount:0,waveConfirmed:false,touchConfirmed:false,touchSeen:false,releaseSince:null,releaseCount:0};
}
function message(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
function fresh(){return connected&&lastReadingAt!==null&&performance.now()-lastReadingAt<1000;}
function controls(){
  $('connectBtn').disabled=connecting;
  $('connectBtn').textContent=connected?'Disconnect':'Connect Bluetooth';
  $('connectBtn').classList.toggle('connected',connected);
  $('startBtn').disabled=!running&&!fresh();
  $('startBtn').textContent=running?'Pause gestures':'Start gestures';
  $('waveUrl').disabled=running;$('touchUrl').disabled=running;
}
function pause(text='Paused. Edit your links or click Start gestures.',error=false){
  running=false;links=null;detector=newDetector();message(text,error);controls();
}
function cleanup(){
  if(characteristic)characteristic.removeEventListener('characteristicvaluechanged',receive);
  if(device)device.removeEventListener('gattserverdisconnected',onDisconnect);
  characteristic=null;connected=false;lastReadingAt=null;buffer='';decoder=new TextDecoder();$('reading').textContent='—';
  pause('Disconnected. Click Connect Bluetooth to reconnect.');
}
function onDisconnect(){cleanup();}
async function connect(){
  if(connecting)return;
  if(connected){if(device?.gatt?.connected)device.gatt.disconnect();else cleanup();return;}
  if(!window.isSecureContext||!navigator.bluetooth){message('Open the live HTTPS page in Chrome on your Chromebook to use Bluetooth.',true);return;}
  connecting=true;controls();message('Choose your HM-10…');
  try{
    device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
    device.addEventListener('gattserverdisconnected',onDisconnect);
    message('Connecting…');
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);
    characteristic=await service.getCharacteristic(CHARACTERISTIC);
    if(!characteristic.properties.notify&&!characteristic.properties.indicate)throw new Error('This device cannot send sensor notifications.');
    buffer='';decoder=new TextDecoder();lastReadingAt=null;
    characteristic.addEventListener('characteristicvaluechanged',receive);
    await characteristic.startNotifications();
    if(!device.gatt.connected)throw new Error('The device disconnected during setup.');
    connected=true;connectedAt=performance.now();
    message(lastReadingAt===null?'Connected. Waiting for readings…':'Connected. Enter your links, then click Start gestures.');
  }catch(error){
    const oldDevice=device;cleanup();if(oldDevice?.gatt?.connected)oldDevice.gatt.disconnect();
    message(error.name==='NotFoundError'?'No HM-10 selected or the expected service was not found. Try connecting again.':'Connection failed: '+error.message,true);
  }finally{connecting=false;controls();}
}
function receive(event){
  buffer+=decoder.decode(event.target.value,{stream:true});
  let end;
  while((end=buffer.indexOf('\n'))!==-1){
    const line=buffer.slice(0,end).trim();buffer=buffer.slice(end+1);
    const match=/^A:(\d{1,4}),B:([01])$/.exec(line);
    if(!match)continue;
    const value=Number(match[1]);if(value>1023)continue;
    const now=performance.now();
    const wasFresh=lastReadingAt!==null&&now-lastReadingAt<1000;
    if(running&&!wasFresh)pause('Readings were interrupted. Click Start gestures again.',true);
    lastReadingAt=now;$('reading').textContent=value;
    if(!running&&!wasFresh)message('Connected. Enter your links, then click Start gestures.');
    if(running)detect(value,now);
  }
  if(buffer.length>4096)buffer='';
  controls();
}
function safeUrl(text){
  text=text.trim();if(!text)return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(text))text='https://'+text;
  const url=new URL(text);
  if(!['https:','http:'].includes(url.protocol)||!url.hostname||url.username||url.password)throw new Error('Enter a normal website address, such as google.com.');
  return url.href;
}
function saveLinks(){
  try{localStorage.setItem('wave-touch-links',JSON.stringify({wave:$('waveUrl').value,touch:$('touchUrl').value}));}catch{}
}
function start(){
  if(running){pause();return;}
  if(!fresh()){message('Connect Bluetooth and wait for live readings first.',true);return;}
  try{
    const selected={wave:safeUrl($('waveUrl').value),touch:safeUrl($('touchUrl').value)};
    if(!selected.wave&&!selected.touch)throw new Error('Enter at least one link first.');
    // A real click opens the output tab; Bluetooth gestures reuse it.
    if(!outputTab||outputTab.closed){
      outputTab=window.open('about:blank','_blank');
      if(!outputTab)throw new Error('Allow pop-ups for this page, then click Start gestures again.');
      outputTab.opener=null;outputTab.document.title='Gesture links';
      outputTab.document.body.textContent='Ready. Wave near the wire, or touch and release, to open your link. Keep the controller tab open. If gestures pause, bring the controller back into view.';
      outputTab.document.body.style.cssText='font:18px/1.6 Arial,sans-serif;color:#202124;max-width:560px;margin:80px auto;padding:24px';
    }
    links=selected;running=true;detector=newDetector();saveLinks();
    message('Ready. Keep your hand away briefly, then wave or touch.');controls();
  }catch(error){pause(error.message,true);}
}
function openGesture(kind){
  const url=links?.[kind];
  if(!url){message((kind==='touch'?'Touch':'Wave')+' detected. That link is blank.');return;}
  try{
    if(!outputTab||outputTab.closed)throw new Error('The link tab is closed. Click Start gestures to open it again.');
    outputTab.location.href=url;
    message((kind==='touch'?'Touch':'Wave')+' link opened. Ready for your next gesture.');
  }catch(error){pause('Click Start gestures to reopen the link tab. '+error.message,true);}
}
function detect(value,now){
  if(!running)return;
  const d=detector;
  if(d.phase==='waiting'){
    if(value<=RELEASE_MAX){
      d.quietSince??=now;d.quietCount++;
      if(now-d.quietSince>=300&&d.quietCount>=3&&now>=d.until)d.phase='ready';
    }else{d.quietSince=null;d.quietCount=0;}
    return;
  }
  if(d.phase==='ready'){
    if(value<WAVE_MIN)return;
    d.phase='active';
  }
  // Keep tracking one complete gesture, so touching can take priority
  // over the hover readings seen while a hand approaches or leaves.
  if(value>=TOUCH_MIN){
    d.touchSeen=true;d.touchSince??=now;d.touchCount++;
    if(!d.touchConfirmed&&now-d.touchSince>=60&&d.touchCount>=3){
      d.touchConfirmed=true;message('Touch detected. Release the wire to open your link.');
    }
  }else{d.touchSince=null;d.touchCount=0;}
  if(value>=WAVE_MIN&&value<=WAVE_MAX){
    d.waveSince??=now;d.waveCount++;
    if(!d.waveConfirmed&&now-d.waveSince>=90&&d.waveCount>=3){
      d.waveConfirmed=true;
      if(!d.touchSeen)message('Wave detected. Move your hand away to open your link.');
    }
  }else{d.waveSince=null;d.waveCount=0;}
  if(value<=RELEASE_MAX){
    d.releaseSince??=now;d.releaseCount++;
    if(now-d.releaseSince>=240&&d.releaseCount>=3){
      const kind=d.touchConfirmed?'touch':(!d.touchSeen&&d.waveConfirmed?'wave':null);
      detector=newDetector(now+1000);
      if(kind)openGesture(kind);else message('Ready. Wave or touch the wire, then move away.');
    }
  }else{d.releaseSince=null;d.releaseCount=0;}
}
function checkConnection(){
  if(running&&!fresh())pause('Sensor readings stopped. Wait for readings, then click Start gestures again.',true);
  if(connected&&lastReadingAt===null&&performance.now()-connectedAt>5000)message('Connected, but no sensor readings. Check that the ADCTouch sketch is running.',true);
  controls();
}
try{
  const saved=JSON.parse(localStorage.getItem('wave-touch-links')||'null');
  if(saved&&typeof saved.wave==='string')$('waveUrl').value=saved.wave;
  if(saved&&typeof saved.touch==='string')$('touchUrl').value=saved.touch;
}catch{}
$('connectBtn').addEventListener('click',connect);$('startBtn').addEventListener('click',start);
['waveUrl','touchUrl'].forEach(id=>$(id).addEventListener('input',saveLinks));
window.addEventListener('pagehide',()=>{if(device?.gatt?.connected)device.gatt.disconnect();});
controls();setInterval(checkConnection,250);
</script>
</body>
</html>
